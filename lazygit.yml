os:
  editPreset: nvim

gui:
  nerdFontsVersion: "3"

  # Matches the Neovim colorscheme (generated by snacks.nvim into
  # ~/.cache/nvim/lazygit-theme.yml, plus the keys snacks doesn't emit)
  theme:
    activeBorderColor:
      - "bold"
    inactiveBorderColor:
      - "#5a5b5e"
    searchingActiveBorderColor:
      - "bold"

    optionsTextColor:
      - "#57a5e5"
    defaultFgColor:
      - "#a7aab0"

    selectedLineBgColor:
      - "#37383d"
    inactiveViewSelectedLineBgColor:
      - "bold"

    cherryPickedCommitFgColor:
      - "#57a5e5"
    cherryPickedCommitBgColor:
      - "#de5d68"

    markedBaseCommitFgColor:
      - "#57a5e5"
    markedBaseCommitBgColor:
      - "#dbb671"

    unstagedChangesColor:
      - "#de5d68"

git:
  diffRenderers:
    - type: stdinFilter
      name: delta
      colorArg: always
      command: delta --paging=never --features=
    - type: stdinFilter
      name: delta side-by-side
      colorArg: always
      command: delta --paging=never
