set -g mouse on
set -g base-index 1
set -g default-terminal "screen-256color"
set -g mode-keys vi
setw -g mode-keys vi

# Plugins (installed via TPM, see README)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=#ffffff,bg=#a67c1a,bold"

# Splitting panes with v and s
unbind s
bind v split-window -h
bind s split-window -v

# Moving between panes with Prefix h,j,k,l
unbind l

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing panes with Prefix H,J,K,L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Set the default terminal mode to 256color mode
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Renumber on closing a window
set-option -g renumber-windows on

# Keep title in sync with window title
set-option -g set-titles on
set-option -g set-titles-string "tmux - #{pane_title}"

# Remap copying keys
bind Escape copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi 'C-q' send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind p
bind p paste-buffer

# Moving to last window
bind N last-window

# New session
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# Kill current session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Pane movement
bind-key @ command-prompt -p "Join pane from:" "join-pane -h -s '%%'"
bind-key ! break-pane

# Toggle status line
bind-key g set-option -g status

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf

# Theme
set -g status-position bottom
set -g status-style "bg=#232326,fg=#a7aab0"
set -g status-right-length 100

set -g pane-active-border-style "fg=#57a5e5"
set -g pane-border-style "fg=#35363b"
set -g message-command-style "fg=#a7aab0,bg=#35363b,fill=#35363b"
set -g message-style "fg=#a7aab0,bg=#35363b,fill=#35363b"

setw -g window-status-format "#[fg=#96979c,bg=#232326] #I:#W "
setw -g window-status-current-format "#[fg=#57a5e5,bg=#232326,bold] #I:#W "
setw -g window-status-activity-style "fg=#ffffff,bg=#a67c1a,bold"
setw -g window-status-separator ""

set -g mode-style "bg=#57a5e5,fg=#232326"
set -g clock-mode-colour "#57a5e5"
set -g clock-mode-style 24

# Custom right status without battery
set -g status-right "\
#{prefix_highlight} \
#[fg=#57a5e5] #[fg=#a7aab0]#(~/.config/tmux/tmux-cpu-usage.sh) \
#[fg=#96979c]│ \
#[fg=#57a5e5] #[fg=#a7aab0]#(free | awk '/^Mem/ { printf(\"%.0f%%\", \$3/\$2 * 100 - 0.5) }' ) \
#[fg=#96979c]│ \
#[fg=#57a5e5] #[fg=#a7aab0]#([ #{pane_current_path} = \$HOME ] && echo '~' || basename #{pane_current_path}) "

# Custom left status
set-option -g status-left "#[fg=#57a5e5,bold]  #S #[fg=#96979c]│ "

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
