set -g mouse on
set -g base-index 1
set -g default-terminal "screen-256color"
set -g mode-keys vi
setw -g mode-keys vi

# Plugins (installed via TPM, see README)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'

# Splitting panes with v and s
unbind s
bind v split-window -h
bind s split-window -v

# Moving between panes with Prefix h,j,k,l
unbind l

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing panes with Prefix H,J,K,L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Set the default terminal mode to 256color mode
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Renumber on closing a window
set-option -g renumber-windows on

# Keep title in sync with window title
set-option -g set-titles on
set-option -g set-titles-string "tmux - #{pane_title}"

# Remap copying keys
bind Escape copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi 'C-q' send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind p
bind p paste-buffer

# Moving to last window
bind N last-window

# Pane movement
bind-key @ command-prompt -p "join pane from:"  "join-pane -h -s '%%'"

# Toggle status line
bind-key g set-option -g status

# Theme
set -g status-justify "left"
set -g status-left-style "none"
set -g message-command-style "fg=#a7aab0,bg=#35363b"
set -g status-right-style "none"
set -g pane-active-border-style "fg=#57a5e5"
set -g status-style "none,bg=#232326"
set -g message-style "fg=#a7aab0,bg=#35363b"
set -g pane-border-style "fg=#35363b"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#5a5b5e,bg=#232326"
set -g status-left "#[fg=#101012,bg=#8fb573] #S #[fg=#8fb573,bg=#232326,nobold,nounderscore,noitalics]"
set -g status-right "#{prefix_highlight} #[fg=#35363b]#[fg=#a7aab0,bg=#35363b] %H:%M "
setw -g window-status-format "#[fg=#232326,bg=#2c2d31]#[fg=#a7aab0,bg=#2c2d31] #I | #W #[fg=#2c2d31,bg=#232326]"
setw -g window-status-current-format "#[fg=#232326,bg=#57a5e5]#[fg=#101012,bg=#57a5e5] #I | #W #[fg=#57a5e5,bg=#232326]"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
